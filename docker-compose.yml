services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: automotive
      # DEMO-ONLY credentials (user/password/database all "automotive"). Do not deploy with these:
      # change them, and do not publish this database port, before any use beyond a local demo.
      POSTGRES_PASSWORD: automotive
      POSTGRES_DB: automotive_vision
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automotive"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8020:8000"
    environment:
      # Must match the demo-only database credentials above; change both together.
      DATABASE_URL: postgresql://automotive:automotive@db:5432/automotive_vision
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
