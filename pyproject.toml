[project]
name = "automotive-vision"
version = "0.1.0"
description = "Automotive vision defect detection with anomaly detection, uncertainty estimation, and active learning"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26,<2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "scikit-learn>=1.5",
    "scikit-image>=0.24",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "mlflow-skinny>=2.15",
    "tqdm>=4.66",
    "streamlit>=1.37",
    "grad-cam>=1.5",
    "huggingface-hub>=0.24",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
