# Inference-time thresholds. Configurable, not asserted as optimal: the values below were
# selected on out-of-fold validation data (reports/metrics/review_policy_frozen.json) and
# scored once on the held-out test images (reports/metrics/review_policy_evaluation.json).
# The anomaly gate is off: on the validation pool it would send ~95% of images to review.
inference:
  checkpoint_path: models/checkpoints/defect_classifier.pt
  anomaly_checkpoint_path: models/checkpoints/patchcore_memory_bank.pt
  # CPU by default for API serving: MPS is tuned for a single interactive process,
  # not concurrent requests across uvicorn workers. Override for single-process/
  # notebook use if desired.
  device: cpu
  # Below this softmax confidence, a prediction is routed to human review instead of
  # being auto-decided.
  # 0.74 and temperature 1.4568 come from out-of-fold predictions on the 80-image labeled pool
  # (scripts/evaluate_review_policy.py validate -> reports/metrics/review_policy_frozen.json),
  # not from the held-out test set.
  confidence_threshold: 0.74
  # Optional secondary gate on normalized entropy (0-1); set to null to disable.
  entropy_threshold: null
  # Optional gate on the anomaly score (same units as reports/metrics/anomaly_detection.json);
  # set to null to disable and rely on classifier confidence alone.
  anomaly_review_threshold: null
  temperature: 1.4568  # applied to logits before softmax (inference/predictor.py)
